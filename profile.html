<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trainer Profile</title>
  <link rel="icon" type="image/png" href="apple-touch-icon.png" />
  <link rel="stylesheet" href="CSS/profile.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
  <script src="https://kit.fontawesome.com/df00dcb1ce.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.43.4"></script>
</head>
<body>

  <div class="bg-particles" id="bg-particles"></div>

  <!-- Header / Nav -->
  <header class="profile-header">
    <div class="header-left">
      <h1 class="page-title"><i class="fas fa-user-circle"></i> Trainer Profile</h1>
    </div>
    <nav class="profile-nav">
      <a href="index.html" class="pnav-link"><i class="fas fa-bolt"></i> Generator</a>
      <a href="recent.html" class="pnav-link"><i class="fas fa-history"></i> Recent</a>
      <a href="collection.html" class="pnav-link"><i class="fas fa-layer-group"></i> Collection</a>
      <a href="teams.html" class="pnav-link"><i class="fas fa-people-group"></i> My Teams</a>
      <a href="profile.html" class="pnav-link active"><i class="fas fa-user-circle"></i> Profile</a>
      <button id="anim-toggle-btn" class="pnav-link pnav-btn" type="button">
        <i class="fas fa-film"></i> Animations: On
      </button>
      <button id="signout-btn" class="pnav-link pnav-btn pnav-signout" type="button">
        <i class="fas fa-sign-out-alt"></i> Sign Out
      </button>
    </nav>
  </header>

  <!-- Main layout -->
  <main class="profile-layout">

    <!-- Avatar + identity card -->
    <section class="profile-card glass-card">
      <div class="avatar-wrapper">
        <img id="avatar-img" src="Images/default-avatar.png" alt="Trainer Avatar" class="avatar-img" />
        <label class="avatar-upload-btn" for="avatar-input" title="Change avatar">
          <i class="fas fa-camera"></i>
        </label>
        <input type="file" id="avatar-input" accept="image/png, image/jpeg, image/webp" hidden />
        <div class="avatar-loader" id="avatar-loader" style="display:none;">
          <i class="fas fa-spinner fa-spin"></i>
        </div>
      </div>

      <div class="identity-fields">
        <label class="field-label">Trainer Name</label>
        <input type="text" id="trainer-name" class="profile-input" placeholder="Your trainer name" maxlength="30" />

        <label class="field-label">Email</label>
        <input type="text" id="trainer-email" class="profile-input readonly-input" readonly />

        <label class="field-label">Bio <span class="char-hint">(max 160 chars)</span></label>
        <textarea id="trainer-bio" class="profile-textarea" placeholder="Tell trainers about yourself..." maxlength="160" rows="3"></textarea>

        <label class="field-toggle">
          <input type="checkbox" id="public-name-toggle" />
          <span class="toggle-track"><span class="toggle-thumb"></span></span>
          Show trainer name publicly
        </label>
      </div>
    </section>

    <!-- Preferences card -->
    <section class="profile-card glass-card">
      <h2 class="card-section-title"><i class="fas fa-sliders-h"></i> Preferences</h2>

      <label class="field-label">Favourite Pokémon Type</label>
      <select id="fav-type" class="profile-select">
        <option value="">-- None selected --</option>
        <option value="bug">Bug</option>
        <option value="dark">Dark</option>
        <option value="dragon">Dragon</option>
        <option value="electric">Electric</option>
        <option value="fairy">Fairy</option>
        <option value="fighting">Fighting</option>
        <option value="fire">Fire</option>
        <option value="flying">Flying</option>
        <option value="ghost">Ghost</option>
        <option value="grass">Grass</option>
        <option value="ground">Ground</option>
        <option value="ice">Ice</option>
        <option value="normal">Normal</option>
        <option value="poison">Poison</option>
        <option value="psychic">Psychic</option>
        <option value="rock">Rock</option>
        <option value="steel">Steel</option>
        <option value="water">Water</option>
      </select>

      <label class="field-toggle" style="margin-top: 18px;">
        <input type="checkbox" id="anim-pref-toggle" />
        <span class="toggle-track"><span class="toggle-thumb"></span></span>
        Enable card animations by default
      </label>
    </section>

    <!-- Trainer stats card (read-only) -->
    <section class="profile-card glass-card stats-card">
      <h2 class="card-section-title"><i class="fas fa-chart-bar"></i> Trainer Stats</h2>
      <div class="stats-grid">
        <div class="stat-block">
          <span class="stat-value" id="stat-captured">--</span>
          <span class="stat-label">Pokémon Captured</span>
        </div>
        <div class="stat-block">
          <span class="stat-value" id="stat-teams">--</span>
          <span class="stat-label">Teams Built</span>
        </div>
        <div class="stat-block">
          <span class="stat-value" id="stat-joined">--</span>
          <span class="stat-label">Member Since</span>
        </div>
        <div class="stat-block">
          <span class="stat-value" id="stat-favorites">--</span>
          <span class="stat-label">Favourites</span>
        </div>
      </div>
    </section>

    <!-- Save button -->
    <div class="save-row">
      <button class="save-btn" id="save-profile-btn">
        <i class="fas fa-save"></i> Save Profile
      </button>
    </div>

  </main>

  <!-- Toast notification -->
  <div class="toast" id="toast"></div>

  <script src="Javascript/supabase-client.js"></script>
  <script src="Javascript/animation-toggle.js"></script>
  <script src="Javascript/profile.js"></script>
</body>
</html>
